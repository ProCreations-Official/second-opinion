name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile CLI
        run: python -m py_compile bin/second-opinion

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test command surface
        run: |
          python bin/second-opinion --version
          python bin/second-opinion ask codex --dry-run --manager none -- "CI harness smoke test"
